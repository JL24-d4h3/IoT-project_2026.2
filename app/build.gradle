plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

def propiedadesLocales = new Properties()
def archivoLocal = rootProject.file('local.properties')
if (archivoLocal.exists()) archivoLocal.withInputStream { propiedadesLocales.load(it) }
def secretosMapas = new Properties()
def archivoSecretosMapas = rootProject.file('secrets.properties')
if (archivoSecretosMapas.exists()) archivoSecretosMapas.withInputStream { secretosMapas.load(it) }
def claveMapas = secretosMapas.getProperty('MAPS_API_KEY', propiedadesLocales.getProperty('MAPS_API_KEY', ''))
def urlTaxistas = providers.gradleProperty('taxistasApiBaseUrl')
        .orElse(providers.environmentVariable('TAXISTAS_API_BASE_URL'))
        .getOrElse(propiedadesLocales.getProperty('taxistas.api.baseUrl', ''))

android {
    namespace 'org.iot.project'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "org.iot.project"
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "org.iot.project.test.EmulatorTestRunner"
        manifestPlaceholders = [MAPS_API_KEY: claveMapas]
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'TAXISTAS_API_BASE_URL', groovy.json.JsonOutput.toJson(
                    urlTaxistas ?: 'http://10.0.2.2:8080/')
        }
        release {
            buildConfigField 'String', 'TAXISTAS_API_BASE_URL', groovy.json.JsonOutput.toJson(urlTaxistas)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.play.services.auth
    implementation libs.google.id
    implementation libs.google.maps
    implementation libs.gson
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore

    implementation libs.androidx.core
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.fragment
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.viewpager2
    implementation libs.androidx.swiperefreshlayout
    implementation libs.glide

    // Codificación del QR del cliente y lector de cámara del conductor.
    implementation libs.zxing
    implementation libs.zxing.embedded

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}
