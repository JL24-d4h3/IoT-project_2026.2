<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Gestion de taxistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --ink: #14181f;
            --ink-suave: #232a35;
            --texto: #2b323d;
            --apagado: #5a6473;
            --linea: #d9dee6;
            --fondo: #eef1f5;
            --primario: #0C5D63;
            --primario-oscuro: #083f43;
            --primario-suave: #e3edee;
            --verde: #1f7a5c;
            --rojo: #b3261e;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--fondo);
            color: var(--texto);
            font-size: 0.95rem;
        }

        h1, h2, h3, .fuente-titulo {
            font-family: 'Sora', 'Inter', sans-serif;
            letter-spacing: -0.015em;
        }

        /* Franja superior en el color institucional; unico elemento decorativo del sitio */
        .franja-superior {
            height: 6px;
            background-color: var(--primario);
        }

        .barra-superior {
            background-color: var(--ink);
            color: #fff;
        }

        .marca {
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.01em;
            text-decoration: none;
        }
        .marca-icono {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background-color: var(--primario);
            margin-right: 0.5rem;
        }

        .panel {
            background: #fff;
            border: 1px solid var(--linea);
            border-radius: 10px;
        }

        .form-label { font-weight: 500; color: var(--ink-suave); margin-bottom: 0.3rem; }
        .form-control, .form-select { border-color: var(--linea); padding: 0.6rem 0.75rem; }
        .form-control:focus, .form-select:focus {
            border-color: var(--primario);
            box-shadow: 0 0 0 3px rgba(12, 93, 99, 0.2);
        }
        .form-text { color: var(--apagado); }

        .btn-primario {
            background-color: var(--primario);
            border: 1px solid var(--primario-oscuro);
            color: #fff;
            font-weight: 600;
        }
        .btn-primario:hover { background-color: var(--primario-oscuro); color: #fff; }
        .btn-primario:focus-visible { outline: 3px solid rgba(12, 93, 99, 0.4); outline-offset: 2px; }

        .grupo-campos {
            border-top: 1px solid var(--linea);
            padding-top: 1.25rem;
            margin-top: 1.75rem;
        }
        .grupo-campos:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
        .grupo-campos > h2 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .indicador {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .punto {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--apagado); display: inline-block;
        }
        .punto-ok { background: var(--verde); }
        .punto-espera { background: #8a6d00; }
        .punto-off { background: var(--rojo); }

        .tabla-taxistas > :not(caption) > * > * { padding: 0.85rem 0.75rem; vertical-align: middle; }
        .tabla-taxistas thead th {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--apagado);
            border-bottom: 2px solid var(--linea);
        }
        .fila-inactiva { background-color: #fbfbfc; color: var(--apagado); }

        .avatar {
            width: 44px; height: 44px; border-radius: 50%;
            object-fit: cover; flex-shrink: 0; display: block;
            border: 1px solid var(--linea);
        }
        .avatar-vacio {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--primario-suave); color: var(--primario);
            font-weight: 600; font-size: 0.85rem; text-transform: uppercase;
        }

        .cifra { font-family: 'Sora', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--ink); }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

<!--
    Cabecera publica: solo el registro de taxistas vive aqui, sin enlaces al
    panel del Superadmin ni a la documentacion de la API. El taxista no tiene
    forma de navegar hacia ahi desde esta pantalla.
-->
<div th:fragment="navegacion(seccion)">
    <div class="franja-superior"></div>
    <nav class="barra-superior">
        <div class="container d-flex align-items-center py-3">
            <span class="marca d-inline-flex align-items-center">
                <span class="marca-icono" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 16l1.6-5.6A2 2 0 0 1 7.5 9h9a2 2 0 0 1 1.9 1.4L20 16"
                              stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="3" y="16" width="18" height="4" rx="1.2" stroke="#fff" stroke-width="1.8"/>
                        <circle cx="7.5" cy="20" r="1.3" fill="#fff"/>
                        <circle cx="16.5" cy="20" r="1.3" fill="#fff"/>
                    </svg>
                </span>
                Gestion de taxistas
            </span>
        </div>
    </nav>
</div>
</body>
</html>
