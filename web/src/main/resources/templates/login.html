<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/estilos :: cabecera('Acceso del administrador')}"></head>
<body>

<div th:replace="~{fragments/estilos :: navegacion('login')}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="panel p-4">
                <h1 class="h5 mb-3">Acceso del administrador</h1>

                <div class="alert alert-danger py-2 small" th:if="${param.error}">
                    Usuario o contrasena incorrectos.
                </div>
                <div class="alert alert-success py-2 small" th:if="${param.salida}">
                    Cerraste sesion.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="username">Usuario</label>
                        <input type="text" id="username" name="username" class="form-control"
                               autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Contrasena</label>
                        <input type="password" id="password" name="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primario w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
